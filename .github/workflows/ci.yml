name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: CLI smoke test
        run: |
          cp upkeep.example.json upkeep.json
          node upkeep.ts help
          node upkeep.ts list
